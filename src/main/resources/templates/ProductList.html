<style type="text/css">
    html,body{height:100%;}
    body,*{margin:0;padding:0;text-decoration:none; border:0;list-style-type: none;}
    body{ margin:0px;font-family: "微软雅黑","宋体",Arial;background-color:#ffffff;line-height:1.8;font-size:14px;}
    input[type="submit"],input[type="reset"],input[type="button"],button { -webkit-appearance: none; }
    .wrappers{width:100%; min-height:100%; padding:0px 0px 0px 0px;margin:0px auto;text-align:center;position: relative;overflow:hidden;}
    @media screen and (min-width: 1200px) {
        .wrappers{max-width:640px; }
    }
    .wrapper1{width:100%;margin:0px auto; text-align:center; position: relative;}
    .wrapper2{width:100%;margin:0px auto; text-align:center; position: relative; overflow:hidden;}
    .wrapper2 img{ float:left;}
    .wrapper3{width:100%;margin:0px auto; text-align:left; position: relative; }
    /*img{ max-width:100%; height:auto; max-width:100% !important; height:auto !important;}*/
    .znfuqi{width:100%; margin:0px auto; text-align:center; position:absolute; z-index:99;}
    .znfanhuisy{ display:none !important;}
        .bgimg {
        background:url("/imgs/img.png");
        width: 100%;
        height: 140px;
        }
        #tab-first{
            color: #FFFFFF;
        }
        #tab-second{
            color: #FFFFFF;
        }
    .tabs-wrapper {
        display: flex;
    }
    .custom-tabs .el-tabs__header {
        flex: 0 0 auto; /* 使标签不随内容滚动 */
    }
    .custom-tabs .el-tabs__content {
        flex: 0; /* 使内容部分填充剩余空间并允许滚动 */
        overflow: auto; /* 允许内容滚动 */
        height: 490px; /* 设置内容区域的高度 */
    }
    .banner {
        width: 100%;
        height: 200px;
        background: url('/imgs/img.png') center/cover no-repeat;
        position: fixed;
        top: 0;
        left: 0px;
        z-index: 1000;
    }
    /* 全屏遮罩，背景色可根据品牌风格修改 */
    #splash-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        background-color: #90bfef; /* 背景颜色 */
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 1000;
        transition: opacity 1s ease-out;
    }

    /* Logo 样式 */
    #logo {
        width: 100%; /* 可根据需要调整 */
        height: auto;
        animation: fadeIn 1s ease-in-out;
    }

    /* 主页内容默认隐藏 */
    #main-content {
        display: none;
        text-align: center;
        padding: 10px;
    }

    /* Logo 淡入动画 */
    @keyframes fadeIn {
        from { opacity: 0; transform: scale(0.8); }
        to { opacity: 1; transform: scale(1); }
    }

</style>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        setTimeout(() => {
            document.getElementById("splash-screen").style.opacity = "0";
            setTimeout(() => {
                document.getElementById("splash-screen").style.display = "none";
                document.getElementById("main-content").style.display = "block";
            }, 1500); // 1秒淡出后隐藏
        }, 2500); // 1.5秒后开始淡出
    });

</script>

<body class="" style="background-color: #8a8484">
<!--html代码 -->

<script src="/vue/vue.min.js"></script>
<script src="/vue/element-ui.min.js"></script>
<script type="text/javascript">
    new Vue({
        el: '#app',
        data() {
            return {
                activeName: '1',
                currentDate: new Date(),
                pname:'',
                plist:[],
                hplist:[]

            };
        },
        //初始化
        mounted: function () {
            var newthis = this;
            //产品列表
            var purl = '/plist/list';
            $.ajax({
                type: 'POST',
                url: purl,
                dataType: 'json',
                success: function (result) {
                    for (var i = 0; i < result.length; i++) {
                        if (result[i].label == 'hardware'){
                            newthis.hplist.push(result[i]);
                        } else{
                            newthis.plist.push(result[i]);
                        }

                    }
                },
                error: function () {
                    console.log('error submit!!');
                    return false;
                }
            });
            var player = new Aliplayer({
                id: "player",
                source: "/imgs/video.mp4", // 比如 https://your-video-url.com/video.mp4
                width: "100%",
                height: "80%",
                muted:true,
                crossorigin:true,
                controls:false,
                autoplay: true, // 是否自动播放，建议在移动端谨慎使用
                isLive: false, // 是否为直播，根据实际情况设置
                rePlay: {
                    replayTimes: 1, // 回看次数，直播时设置
                    replayDuration: 300 // 回看时长，单位为秒，直播时设置
                },
                playsinline: true, // 是否允许内联播放，适用于移动端
                controlBarVisibility: 'always', // 控制条始终显示
                useH5Prism: true, // 使用H5播放器内核，提高兼容性
                coverpic: "封面图URL" // 设置视频封面图
            }, function(player) {
                console.log('播放器初始化成功');
            });
        },
        methods: {
            handleClick(tab, event) {
                console.log(tab, event);
            }

        }
    })
</script>
